name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post comments on the PR
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Should preferably use SHA in prod, e.g. @11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Should preferably use SHA in prod, e.g. @39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 24
          
      - name: Run AI Code Review
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes --package gh-ai-review@latest gh-ai-review review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --post
