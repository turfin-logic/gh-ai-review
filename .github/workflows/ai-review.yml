name: Advisory AI review (manual)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    # Run trusted default-branch code only; never check out the PR head.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Generate advisory comment
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR: ${{ inputs.pr_number }}
          REVIEW_REPO: ${{ github.repository }}
        run: node dist/index.js review "$REVIEW_PR" --repo "$REVIEW_REPO" --post
